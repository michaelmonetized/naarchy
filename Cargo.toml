[package]
name = "naarchy"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
description = "A free, open-source notch / dynamic-island layer for Omarchy & Hyprland — file shelf, clipboard, media, HUDs."
license = "MIT"
repository = "https://github.com/michaelmonetized/naarchy"
readme = "README.md"
categories = ["gui", "multimedia"]
keywords = ["notch", "hyprland", "wayland", "omarchy", "shelf"]

[dependencies]
gtk4 = { version = "0.11", features = ["v4_14"] }
gtk4-layer-shell = "0.8"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-lite = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
wl-clipboard-rs = "0.9"
ureq = { version = "2", default-features = false, features = ["tls"] }
log = "0.4"
env_logger = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

[profile.dev]
opt-level = 1
