name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: archive
        run: |
          ver="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="naarchy-${ver}/" "$GITHUB_REF_NAME" \
            > "naarchy-${ver}-src.tar.gz"
      - uses: softprops/action-gh-release@v2
        with:
          files: naarchy-*-src.tar.gz
          fail_on_unmatched_files: true

  bin:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          targets: ${{ matrix.target }}

      - name: apt build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config meson ninja-build cmake git \
            libgtk-4-dev libwayland-dev wayland-protocols

      - name: gtk4-layer-shell from source
        run: |
          git clone --depth 1 --branch v1.0.4 \
            https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          meson setup /tmp/gtk4-layer-shell/build /tmp/gtk4-layer-shell \
            --prefix=/usr \
            -Dexamples=false -Ddocs=false -Dtests=false \
            -Dintrospection=false -Dvapi=false
          ninja -C /tmp/gtk4-layer-shell/build
          sudo ninja -C /tmp/gtk4-layer-shell/build install
          sudo ldconfig

      - name: build
        run: cargo build --release --bins --locked --target ${{ matrix.target }}

      - name: name the binary
        run: |
          src="target/${{ matrix.target }}/release/naarchy"
          install -Dm755 "$src" "naarchy-${{ matrix.target }}"
          file "naarchy-${{ matrix.target }}"

      - uses: softprops/action-gh-release@v2
        with:
          files: naarchy-${{ matrix.target }}
          fail_on_unmatched_files: true
