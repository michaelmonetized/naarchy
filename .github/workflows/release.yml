name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  binaries:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-linux
      - name: Verify tag matches package version
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as source:
              version = tomllib.load(source)['package']['version']
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Tag and package version disagree'
          PY
      - run: cargo test --locked --bins
      - run: cargo build --locked --release --bins --target ${{ matrix.target }}
      - name: Verify CLI and package binary
        env:
          BIN: ./target/${{ matrix.target }}/release/naarchy
        run: |
          "$BIN" --version
          bash scripts/smoke.sh
          package="$RUNNER_TEMP/naarchy-${{ matrix.target }}"
          install -Dm755 "$BIN" "$package/bin/naarchy"
          mkdir -p "$package/contrib" "$package/scripts" dist
          install -m644 contrib/naarchy.desktop contrib/naarchy.service \
            contrib/app.naarchy.Naarchy.svg contrib/hyprland.conf "$package/contrib/"
          install -m755 scripts/install.sh "$package/scripts/"
          install -m644 README.md CHANGELOG.md CONTRIBUTING.md LICENSE "$package/"
          cp -R docs "$package/docs"
          tar -C "$RUNNER_TEMP" -czf "dist/naarchy-${{ matrix.target }}.tar.gz" "naarchy-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: naarchy-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  draft:
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Archive source and checksum artifacts
        run: |
          version="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="naarchy-${version}/" "$GITHUB_REF_NAME" \
            > "dist/naarchy-${version}-src.tar.gz"
          cd dist
          sha256sum naarchy-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
